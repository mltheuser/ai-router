# OpenAI's /models endpoint lists model IDs only, without capabilities,
# context windows or pricing. This file supplies that metadata for the models
# we care about, one section per use case. A listed model that appears in no
# section is not offered for any use case.

chat:
  gpt-6-luna:
    features: [tools, vision, structured_output, reasoning]
    context_window: 922000
    cost_per_m_input: 0.10
    cost_per_m_output: 0.50

  gpt-6-sol:
    features: [tools, vision, structured_output, reasoning]
    context_window: 922000
    cost_per_m_input: 2.00
    cost_per_m_output: 10.00

  gpt-6-astra:
    features: [tools, vision, structured_output, reasoning]
    context_window: 922000
    cost_per_m_input: 10.00
    cost_per_m_output: 50.00

embedding:
  text-embedding-3-small:
    context_window: 8192
    cost_per_m_input: 0.02

  text-embedding-3-large:
    context_window: 8192
    cost_per_m_input: 0.13
