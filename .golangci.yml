version: "2"

linters:
  # Keep the v2 default set (errcheck, govet, ineffassign, staticcheck, unused)
  # and add a few strict extras on top.
  default: standard
  enable:
    - revive
    - unparam
    - unconvert
    - misspell
  settings:
    revive:
      rules:
        # The Provider interface in provider/provider.go is the single source of
        # truth for what each method does; forcing a doc comment onto every
        # interface-implementing/delegating method just restates that contract.
        - name: exported
          disabled: true

formatters:
  enable:
    - gofumpt
    - gci
